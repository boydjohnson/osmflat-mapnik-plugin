[package]
name = "osmflat-capi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "osmflat_capi"
# staticlib so the Rust code is baked directly into the `osmflat.input`
# mapnik module -- no separate dylib to locate at runtime.
crate-type = ["staticlib"]

[dependencies]
# Both fetched from git rather than a sibling checkout, so a clone of this
# repo alone builds. `osmflat`'s git URL + branch must keep matching the one
# osmflat-ext itself depends on (see its workspace Cargo.toml): cargo only
# unifies the two into one `osmflat::Osm` type when the source ids are
# identical, and a mismatch means `ExtArchive::open` won't accept our archive.
osmflat = { git = "https://github.com/boydjohnson/osmflat-rs", branch = "main" }
# Sidecar inverted tag index → push tag-filtering into the spatial query.
osmflat-ext = { git = "https://github.com/boydjohnson/osmflat-ext", branch = "main" }

[dev-dependencies]
# Synthetic archive fixtures (tags + members) for the member_of tests.
osmflat-extc = { git = "https://github.com/boydjohnson/osmflat-ext", branch = "main", features = ["test-support"] }

[build-dependencies]
cbindgen = "0.27"

[profile.release]
lto = true
codegen-units = 1
