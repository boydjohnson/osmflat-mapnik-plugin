[package]
name = "osmflat-capi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "osmflat_capi"
# staticlib so the Rust code is baked directly into the `osmflat.input`
# mapnik module -- no separate dylib to locate at runtime.
crate-type = ["staticlib"]

[dependencies]
osmflat = { path = "../../../osmflat-rs/osmflat" }
# Sidecar inverted tag index → push tag-filtering into the spatial query.
osmflat-ext = { path = "../../../osmflat-ext/osmflat-ext" }

[dev-dependencies]
# Synthetic archive fixtures (tags + members) for the member_of tests.
osmflat-extc = { path = "../../../osmflat-ext/osmflat-extc", features = ["test-support"] }

[build-dependencies]
cbindgen = "0.27"

# osmflat-ext pulls osmflat via git; pin it to the same local path so the two
# crates share one `osmflat::Osm` type (otherwise ExtArchive::open won't accept
# our archive).
[patch."https://github.com/boydjohnson/osmflat-rs"]
osmflat = { path = "../../../osmflat-rs/osmflat" }

[profile.release]
lto = true
codegen-units = 1
